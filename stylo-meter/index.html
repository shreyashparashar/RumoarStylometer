<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Stylo Meter by RUMOAR</title>
<meta name="description" content="Rate the look, never the man. Upload your photos, get an honest five-pillar score, and finish the look with RUMOAR.">
<meta name="theme-color" content="#0A0A0A">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="assets/icon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/styles.css">
</head>
<body>
<div class="shell">
  <aside class="story" aria-hidden="true">
    <div class="brand">RUMOAR</div>
    <div class="step" id="storyStep"></div>
    <h1 id="storyTitle"></h1>
    <p id="storyText"></p>
    <div class="rail" id="storyRail"></div>
  </aside>
  <main class="app" id="app" aria-live="polite"></main>
</div>
<div class="toast" id="toast" role="status"></div>
<noscript><p style="color:#fff;padding:40px;font-family:sans-serif">The Stylo Meter needs JavaScript to run on your device.</p></noscript>
<script type="module" src="js/app.js"></script>
</body>
</html>
