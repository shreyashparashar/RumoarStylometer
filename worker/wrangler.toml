name = "stylo-meter-ai"
main = "worker.js"
compatibility_date = "2026-09-01"

[ai]
binding = "AI"

[vars]
# Your GitHub Pages origin, e.g. "https://yourname.github.io". "*" allows any site.
ALLOWED_ORIGIN = "*"
# Optional: which Gemini models to try, best first.
# GEMINI_MODELS = "gemini-3.8-flash,gemini-3.6-flash,gemini-3.5-flash"

# The Gemini key is a SECRET, not a var. Set it with:  npx wrangler secret put GEMINI_API_KEY
